    ${L.checked.size ? `<div class="s-bar"><span>${L.checked.size}개 선택</span><button class="btn primary" data-act="lGroup">그룹 만들기</button><button class="btn" data-act="lUncheck">취소</button></div>` : ''}
    <ul class="s-list">${html}</ul>`;
}

function targetOpts(q, cur, withNext){
  const i = lIdx(q.id), next = L.qs[i + 1], later = L.qs.slice(i + 1);
  let h = withNext ? `<option value="next" ${cur === 'next' ? 'selected' : ''}>${next ? `다음 문항 (Q${i + 2} ${esc(short(qTitle(next)))})` : '응답 완료 (마지막 문항)'}</option>`
    : `<option value="" ${!cur ? 'selected' : ''}>이동할 곳 선택</option>`;
  if (later.length) h += `<optgroup label="문항">${later.map((x, k) => `<option value="${x.id}" ${cur === x.id ? 'selected' : ''}>Q${i + k + 2} ${esc(short(qTitle(x)))}</option>`).join('')}</optgroup>`;
  h += `<optgroup label="엔딩">${Object.entries(END).map(([k, v]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${v.label}</option>`).join('')}</optgroup>`;
  // a target that now sits above this question stays visible so the broken link can be seen and fixed
  if (cur && cur !== 'next' && !END[cur] && lIdx(cur) <= i) h += `<option value="${cur}" selected>${lq(cur) ? `Q${lIdx(cur) + 1} ${esc(short(qTitle(lq(cur))))} (앞 문항)` : '(삭제된 문항)'}</option>`;
  return h;
}

function testPanelHTML(){
  const steps = L.test.steps, last = steps[steps.length - 1];
  const done = steps.filter(s => s.ans !== null && s.id !== 'broken').map(s => {
    const q = lq(s.id);
    return `<li><b>${lno(q)} ${esc(short(qTitle(q)))}</b> → ${s.ans ? `"${esc(s.ans)}"` : '응답함'}</li>`;
  }).join('');
  let body;
  if (END[last.id]) body = `<div class="t-end"><b>${END[last.id].label}</b>에 도착했어요<small>${END[last.id].desc}</small></div>`;
  else if (last.id === 'broken') body = `<div class="t-stop">${esc(last.from)}에서 갈 곳이 없어 멈췄어요. 로직을 확인해주세요.</div>`;
  else {
    const q = lq(last.id);
    body = `<div class="t-q"><span class="qno">${lno(q)}</span>${esc(qTitle(q))}</div>
      ${answersOf(q).length ? answersOf(q).map(o => `<button class="t-opt" data-act="tAns" data-v="${esc(o)}">${esc(o)}</button>`).join('')
        : `<div class="t-fake">${esc(T[q.type].ph || '응답 입력')}</div><button class="t-opt" data-act="tAns" data-v="">응답하고 다음으로</button>`}`;
  }
  return `<div class="lp-h">▶ 로직 테스트</div>
    <div class="lp-t">답을 고르면 설정한 로직대로 이동해요. 지나온 길은 캔버스에 파랗게 표시돼요.</div>
    ${body}
    ${done ? `<ol class="t-path">${done}</ol>` : ''}
    <div class="t-actions"><button class="btn" data-act="tBack" ${steps.length < 2 ? 'disabled' : ''}>한 단계 뒤로</button>
      <button class="btn" data-act="tRestart">처음부터</button><button class="btn primary" data-act="tStop">테스트 끝내기</button></div>`;
}

function renderLPanel(){
  const p = $('#lPanel'), q = L.sel && lq(L.sel);
  if (L.test){ p.innerHTML = testPanelHTML(); return; }
  if (!q){ p.innerHTML = `<div class="rp-empty">문항을 선택해주세요<small>캔버스나 왼쪽 목록에서 문항을 누르면 다음에 갈 곳을 정할 수 있어요</small></div>`; return; }
  const i = lIdx(q.id), upto = L.qs.slice(0, i + 1);
  const condHTML = (r, c, k) => {
    const cq = lq(c.q) || q, vals = answersOf(cq);
    const qSel = `<select class="c-q" data-l="cq" data-k="${k}">${upto.map((x, j) =>
      `<option value="${x.id}" ${x.id === c.q ? 'selected' : ''}>Q${j + 1} · ${esc(short(qTitle(x)))}</option>`).join('')}</select>`;
    const opSel = `<select class="c-op" data-l="op" data-k="${k}">${opsFor(cq).map(o => `<option value="${o}" ${o === c.op ? 'selected' : ''}>${OPS[o]}</option>`).join('')}</select>`;
    const val = vals.length
      ? `<select class="c-v ${c.val ? '' : 'empty-sel'}" data-l="cv" data-k="${k}"><option value="">참조값을 고르세요</option>${vals.map(v => `<option ${c.val === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>`
      : `<input class="c-v" data-l="cv" data-k="${k}" value="${esc(c.val)}" placeholder="참조값을 입력하세요">`;
    const join = k ? `<div class="join"><button class="${r.join === 'and' ? 'on' : ''}" data-act="lJoin" data-v="and">그리고 (AND)</button><button class="${r.join === 'or' ? 'on' : ''}" data-act="lJoin" data-v="or">또는 (OR)</button></div>` : '';
    return `${join}<div class="cond2">${qSel}<div class="c-row">${opSel}${k ? `<button class="x" data-act="lDelCond" data-k="${k}" title="조건 지우기">×</button>` : ''}</div>${val}</div>`;
  };
  const rules = q.rules.map((r, ri) => `<div class="rule2" data-rule="${r.id}">
      <div class="rule-h"><button class="rule-fold" data-act="lFold">로직 #${ri + 1} <span>${r.open === false ? '⌄' : '⌃'}</span></button>
        <button class="x" data-act="lDelRule" title="로직 지우기">×</button></div>
      ${r.open === false ? '' : `<div class="rule-box"><div class="rb-t">조건</div>
        ${r.conds.map((c, k) => condHTML(r, c, k)).join('')}
        <button class="add-cond" data-act="lMore">⊕ 새로운 조건</button>
        <div class="rb-line"></div>
        <div class="lp-row"><span>이동하기</span><select data-l="target" class="${r.target ? '' : 'empty-sel'}">${targetOpts(q, r.target)}</select></div></div>`}
    </div>`).join('');
  p.innerHTML = `<div class="lp-top"><div class="lp-h"><span class="qno">Q${gno(q)}</span>${esc(qTitle(q))}</div>
      <button class="lp-reset" data-act="lResetQ" title="이 문항 로직 초기화">⟳ 초기화</button></div>
    ${L.broken.has(q.id) ? '<div class="lp-warn">연결이 끊겼어요. 이동할 곳을 다시 골라주세요</div>' : ''}
    <div class="lp-row lp-def2"><span>기본 이동</span><select data-l="def">${targetOpts(q, q.def ?? 'next', true)}</select></div>
    <button class="add-rule2" data-act="lAddRule">⊕ 새로운 로직</button>
    ${rules}`;
}
function renderLogic(){
  renderStruct(); renderCanvas(); renderLPanel();
  const tb = $('#tBtn');
  tb.textContent = L.test ? '■ 테스트 끝내기' : '▶ 로직 테스트';
  tb.classList.toggle('on', !!L.test);
  if (L.test) requestAnimationFrame(() => document.querySelector('.ln.cur')?.scrollIntoView({block: 'center', inline: 'nearest', behavior: 'smooth'}));
}

// a test run belongs to the logic screen; leaving the screen ends it
function endTest(why){
  if (!L?.test) return;
  const last = L.test.steps[L.test.steps.length - 1].id;
  if (!END[last] && last !== 'broken') log('logic_test_end', `${why} · ${L.test.steps.length - 1}문항 응답`);
  L.test = null;
}

function testAnswer(v){
  const steps = L.test.steps, last = steps[steps.length - 1], q = lq(last.id);
  last.ans = v;
  const A = Object.fromEntries(steps.filter(s => s.ans !== null && s.id !== 'broken').map(s => [s.id, s.ans]));
  const next = go(q, v, A), i = lIdx(q.id);
  const ok = next && (END[next] || lIdx(next) > i);
  steps.push(ok ? {id: next, ans: null} : {id: 'broken', from: lno(q), ans: null});
  log('logic_test_step', `${lno(q)} · ${v ? `"${v}"` : '응답'} → ${ok ? tLabel(next) : '갈 곳 없음'}`);
  if (!ok || END[next]) log('logic_test_end', `${ok ? END[next].label : '중간에 멈춤'} · ${steps.length - 1}문항 응답`);
}

function afterLogic(){
  const now = new Set(L.qs.filter(isBroken).map(q => q.id));
  now.forEach(id => { if (!L.broken.has(id)) log('broken_link_shown', `${lno(lq(id))} · ${qTitle(lq(id))}`); });
  L.broken = now;
  // scenario questions are found by their wording, so they count whether loaded as samples or typed in the editor
  const [a, b, c, d, , f, g] = SAMPLE.map(([, title]) => L.qs.find(q => q.title.trim() === title));
  const ok = a && b && c && d && f && g ? [go(a, '동의하지 않습니다') === 'end_stop',
    go(b, '개발자') === c.id && go(b, '인프라 운영') === c.id,
    go(b, '기획·PM') === d.id && go(b, '의사결정자') === d.id,
    go(f, '아니오') === 'end_done' && go(f, '예') === g.id] : [false];
  if (!L.done && ok.every(Boolean)){
    L.done = true;
    log('task_complete', `로직 시나리오 1~3 완료 · 구조와 로직 화면 진입 후 ${((Date.now() - L.t0) / 1000).toFixed(1)}초`);
  }
  renderLogic();
}

function moveQ(id, targetId, after){
  if (id === targetId) return;
  const from = lIdx(id), q = L.qs[from], t = lq(targetId);
  L.qs.splice(from, 1);
  L.qs.splice(lIdx(targetId) + (after ? 1 : 0), 0, q);
  q.group = t.group;   // dropping next to a group member joins that group, so groups stay in one piece
  const to = lIdx(id);
  if (to !== from) log('question_reordered', `"${short(q.title)}" ${from + 1}번째 → ${to + 1}번째`);
  afterLogic();
}

function logicChange(el){
  if (el.dataset.scheck){ el.checked ? L.checked.add(el.dataset.scheck) : L.checked.delete(el.dataset.scheck); renderStruct(); renderCanvas(); return; }
  if (el.dataset.gname){
    const g = L.groups[el.dataset.gname], v = el.value.trim() || g.name;
    if (v !== g.name){ log('group_renamed', `"${g.name}" → "${v}"`); g.name = v; }
    el.value = v; return;
  }
  const k = el.dataset.l; if (!k) return;
  const q = lq(L.sel), rEl = el.closest('[data-rule]'), r = rEl && q.rules.find(x => x.id === rEl.dataset.rule), ri = q.rules.indexOf(r);
  const c = r && r.conds[+el.dataset.k], cn = `${lno(q)} · 로직 ${ri + 1} 조건 ${+el.dataset.k + 1}`;
  if (k === 'cq'){ c.q = el.value; c.op = opsFor(lq(c.q))[0]; c.val = ''; log('logic_condition_set', `${cn} 문항: ${tLabel(c.q)}`); }
  if (k === 'op'){ c.op = el.value; log('logic_condition_set', `${cn} 연산자: ${OPS[c.op]}`); }
  if (k === 'cv'){ c.val = el.value.trim(); log('logic_condition_set', `${cn} 참조값: "${c.val || '(비움)'}"`); }
  if (k === 'target'){ r.target = el.value; log('logic_condition_set', `${lno(q)} · 로직 ${ri + 1} 이동: ${el.value ? tLabel(el.value) : '(비움)'}`); }
  if (k === 'def'){ q.def = el.value === 'next' ? null : el.value; log('logic_condition_set', `${lno(q)} · 기본 이동: ${el.value === 'next' ? '다음 문항' : tLabel(el.value)}`); }
  afterLogic();
}

function logicClick(e){
  if (suppressClick) return true;   // the click that ends a node drag shouldn't also select it
  const n = e.target.closest('[data-lnode]');
  if (n){
    if (L.test) return true;
    // Shift+click adds/removes the question from the set to group; a plain click just selects it
    if (e.shiftKey){
      const id = n.dataset.lnode;
      L.checked.has(id) ? L.checked.delete(id) : L.checked.add(id);
      log('group_pick', `${lno(lq(id))} ${L.checked.has(id) ? '선택' : '해제'} · ${L.checked.size}개`);
      renderCanvas(); renderStruct(); return true;
    }
    L.sel = n.dataset.lnode; afterLogic(); return true;
  }
  const row = e.target.closest('[data-sq]');
  if (row && !e.target.closest('input,button')){
    if (L.test) return true;
    L.sel = row.dataset.sq; afterLogic();
    document.querySelector(`[data-lnode="${L.sel}"]`)?.scrollIntoView({block: 'nearest', inline: 'nearest', behavior: 'smooth'});
    return true;
  }
  const a = e.target.closest('[data-act]'); if (!a) return false;
  const q = L.sel && lq(L.sel), rEl = a.closest('[data-rule]'), r = rEl && q.rules.find(x => x.id === rEl.dataset.rule), ri = q ? q.rules.indexOf(r) : -1;
  switch (a.dataset.act){
    case 'tToggle': case 'tStop':
      if (L.test){
        const last = L.test.steps[L.test.steps.length - 1].id;
        if (!END[last] && last !== 'broken') log('logic_test_end', `중간에 끝냄 · ${L.test.steps.length - 1}문항 응답`);
        L.test = null;
      } else {
        if (!L.qs.length){ toast('테스트할 문항이 없어요'); return true; }
        L.test = {steps: [{id: L.qs[0].id, ans: null}]};
        log('logic_test_start');
      }
      renderLogic(); return true;
    case 'tRestart': L.test = {steps: [{id: L.qs[0].id, ans: null}]}; log('logic_test_start', '처음부터 다시'); renderLogic(); return true;
    case 'tAns': testAnswer(a.dataset.v); renderLogic(); return true;
    case 'tBack': {
      const s = L.test.steps; s.pop(); s[s.length - 1].ans = null;
      log('logic_test_step', `한 단계 뒤로 · ${lno(lq(s[s.length - 1].id))}`); renderLogic(); return true;
    }
    case 'lAddRule':
      q.rules.push({id: 'r' + (++L.rseq) + Date.now().toString(36), conds: [{q: q.id, op: 'eq', val: ''}], join: 'and', target: '', open: true});
      log('logic_added', `${lno(q)} · 로직 #${q.rules.length}`); afterLogic(); return true;
    case 'lMore': r.conds.push({q: q.id, op: 'eq', val: ''}); log('logic_condition_set', `${lno(q)} · 로직 ${ri + 1} 새로운 조건 (${r.conds.length}개)`); afterLogic(); return true;
    case 'lDelCond': r.conds.splice(+a.dataset.k, 1); log('logic_condition_set', `${lno(q)} · 로직 ${ri + 1} 조건 지움`); afterLogic(); return true;
    case 'lJoin':
      if (r.join !== a.dataset.v){ r.join = a.dataset.v; log('logic_condition_set', `${lno(q)} · 로직 ${ri + 1} 조건 연결: ${r.join === 'and' ? '그리고 (AND)' : '또는 (OR)'}`); afterLogic(); }
      return true;
    case 'lFold': r.open = r.open === false; renderLPanel(); return true;
    case 'lDelRule': q.rules.splice(ri, 1); log('logic_condition_set', `${lno(q)} · 로직 ${ri + 1} 지움`); afterLogic(); return true;
    case 'lResetQ':
      askConfirm(`${lno(q)} 문항의 로직을 모두 지울까요?<br>이 문항은 다음 문항으로 이어져요.`, '초기화', () => {
        q.rules = []; q.def = null; log('logic_reset_question', `${lno(q)} · ${q.title}`); afterLogic(); });
      return true;
    case 'lResetAll':
      askConfirm('모든 문항의 로직을 지울까요?<br>모든 문항이 순서대로 이어져요.', '모두 초기화', () => {
        L.qs.forEach(x => { x.rules = []; x.def = null; }); log('logic_reset_all'); afterLogic(); });
      return true;
    case 'lSample': loadSample(); return true;
    case 'lArrange': L.arranged = true; L.pos = {}; log('logic_arranged', `엣지 ${edges().length}개`); renderCanvas(); return true;
    case 'lZoom': {
      const v = a.dataset.v, sc = document.querySelector('.lscroll');
      L.zoom = v === 'in' ? Math.min(1.5, L.zoom + .1) : v === 'out' ? Math.max(.4, L.zoom - .1)
        : Math.max(.4, Math.min(1, (sc.clientWidth - 48) / L.W, (sc.clientHeight - 116) / L.H));
      renderCanvas(); return true;
    }
    case 'lBreak': { const x = lq(a.dataset.id); x.pageBreak = true; log('page_break_added', `${lno(x)} 다음에서 나눔`); renderStruct(); return true; }
    case 'lUnbreak': lq(a.dataset.id).pageBreak = false; renderStruct(); return true;
    case 'lBreakSel': {
      if (!q){ toast('페이지를 나눌 문항을 먼저 눌러주세요'); return true; }
      if (lIdx(q.id) === L.qs.length - 1 && !q.pageBreak){ toast('마지막 문항 다음은 나눌 수 없어요'); return true; }
      q.pageBreak = !q.pageBreak;
      log(q.pageBreak ? 'page_break_added' : 'page_break_removed', `${lno(q)} 다음에서 ${q.pageBreak ? '나눔' : '나눔 지움'}`);
      renderStruct(); renderCanvas(); return true;
    }
    case 'lUncheck': L.checked.clear(); renderStruct(); renderCanvas(); return true;
    case 'lSwap': {
      const [x, y] = L.qs.filter(n => L.checked.has(n.id)), qs = [...L.qs], i = qs.indexOf(x), j = qs.indexOf(y);
      [qs[i], qs[j]] = [qs[j], qs[i]];
      // nodes the maker dragged by hand trade their spots too
      const px = L.pos[x.id], py = L.pos[y.id];
      if (py) L.pos[x.id] = py; else delete L.pos[x.id];
      if (px) L.pos[y.id] = px; else delete L.pos[y.id];
      L.qs = qs; L.checked.clear();
      log('question_reordered', `로직 캔버스 · ${short(qTitle(x))} ↔ ${short(qTitle(y))}`);
      afterLogic(); return true;
    }
    case 'lGroup': {
      if (L.checked.size < 2){ toast('Shift를 누른 채 묶을 문항을 2개 이상 눌러주세요'); return true; }
      const picked = L.qs.filter(x => L.checked.has(x.id)), first = L.qs.findIndex(x => L.checked.has(x.id));
      const gid = 'g' + (++L.gseq), name = `그룹 ${L.gseq}`;
      L.groups[gid] = {name};
      const rest = L.qs.filter(x => !L.checked.has(x.id));
      rest.splice(first, 0, ...picked);   // members move next to each other at the first picked position
      picked.forEach(x => x.group = gid);
      L.qs = rest; L.checked.clear();
      log('group_created', `${name} · ${picked.map(x => short(x.title)).join(', ')} (${picked.length}개)`);
      afterLogic(); return true;
    }
    case 'lDelGroup': {
      const g = a.dataset.g;
      L.qs.forEach(x => { if (x.group === g) x.group = null; });
      log('group_deleted', `"${L.groups[g].name}" (문항은 그대로)`);
      delete L.groups[g]; renderStruct(); return true;
    }
  }
  return false;
}

/* canvas: drag nodes, drag empty space to pan, wheel to zoom around the cursor */
let nodeDrag = null, pan = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  if (view !== 'logic' || e.button !== 0) return;
  const n = e.target.closest('.lstage .ln');
  if (n){
    const id = n.dataset.lnode || n.dataset.lid, p = L.lastP[id];
    nodeDrag = {id, x: e.clientX, y: e.clientY, cx: p.cx, py: p.y, moved: false, before: snap()};
    L.frame = {ox: L.ox, oy: L.oy, W: L.W, H: L.H};
    return;
  }
  const sc = e.target.closest('.lscroll');
  if (sc && !e.target.closest('button')){ pan = {sc, x: e.clientX, y: e.clientY, l: sc.scrollLeft, t: sc.scrollTop}; sc.classList.add('panning'); }
});
document.addEventListener('pointermove', e => {
  if (nodeDrag){
    const dx = (e.clientX - nodeDrag.x) / L.zoom, dy = (e.clientY - nodeDrag.y) / L.zoom;
    if (!nodeDrag.moved && Math.hypot(dx, dy) < 4) return;
    nodeDrag.moved = true;
    L.pos[nodeDrag.id] = {cx: nodeDrag.cx + dx, y: nodeDrag.py + dy};
    renderCanvas();
    return;
  }
  if (pan){ pan.sc.scrollLeft = pan.l - (e.clientX - pan.x); pan.sc.scrollTop = pan.t - (e.clientY - pan.y); }
});
document.addEventListener('pointerup', () => {
  if (nodeDrag){
    const d = nodeDrag; nodeDrag = null;
    const before = {ox: L.ox, oy: L.oy};
    L.frame = null;
    if (d.moved){
      pushHist('logic', d.before);
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
      log('logic_node_moved', d.id === 'start' ? '시작' : END[d.id] ? END[d.id].label : `${lno(lq(d.id))} ${short(lq(d.id).title)}`);
      // the canvas origin may shift once the drag ends; scroll by the same amount so nothing jumps
      renderCanvas();
      const sc = document.querySelector('.lscroll');
      sc.scrollLeft += (L.ox - before.ox) * L.zoom; sc.scrollTop += (L.oy - before.oy) * L.zoom;
    }
  }
  if (pan){ pan.sc.classList.remove('panning'); pan = null; }
});
document.addEventListener('wheel', e => {
  if (view !== 'logic') return;
  const sc = e.target.closest?.('.lscroll'); if (!sc) return;
  e.preventDefault();
  const stage = $('#lStage'), r = stage.getBoundingClientRect(), z = L.zoom;
  const px = (e.clientX - r.left) / z, py = (e.clientY - r.top) / z;
  const nz = Math.min(1.5, Math.max(.4, z * Math.exp(-e.deltaY * 0.0015)));
  if (nz === z) return;
  L.zoom = nz; renderCanvas();
  const r2 = stage.getBoundingClientRect();
  sc.scrollLeft += r2.left + px * nz - e.clientX; sc.scrollTop += r2.top + py * nz - e.clientY;
}, {passive: false});

/* editor field list: drag to reorder questions */
let fDrag = null;
// linked = this question has its own logic, or another question's logic points to it
function hasLogicLink(q){
  return (q.rules || []).some(r => r.target) || (q.def ?? null) !== null
    || E.qs.some(x => x.def === q.id || (x.rules || []).some(r => r.target === q.id));
}
function moveEQ(id, targetId, after, where = '목록'){
  if (id === targetId) return;
  const from = E.qs.findIndex(x => x.id === id), q = E.qs[from];
  E.qs.splice(from, 1);
  E.qs.splice(E.qs.findIndex(x => x.id === targetId) + (after ? 1 : 0), 0, q);
  const to = E.qs.indexOf(q);
  if (to === from) return;
  E.cur = q.id;
  log('question_reordered', `"${short(q.title.trim() || '제목 없음')}" ${from + 1}번째 → ${to + 1}번째 (문항 편집 · ${where})`);
  renderFields(); renderCards(); renderPanel(); focusCard(q.id);
  if (hasLogicLink(q)) toast('로직이 연결된 문항이에요. 구조와 로직에서 확인해 주세요');
}
document.addEventListener('dragstart', e => {
  const r = e.target.closest?.('[data-fq]'); if (!r || view !== 'editor') return;
  fDrag = r.dataset.fq; r.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', fDrag);
});
document.addEventListener('dragover', e => {
  const r = e.target.closest?.('[data-fq]'); if (!fDrag || !r) return;
  e.preventDefault();
  const after = E.qs.findIndex(q => q.id === r.dataset.fq) > E.qs.findIndex(q => q.id === fDrag);
  document.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  if (r.dataset.fq !== fDrag) r.classList.add(after ? 'drop-after' : 'drop-before');
});
document.addEventListener('drop', e => {
  const r = e.target.closest?.('[data-fq]'); if (!fDrag || !r) return;
  e.preventDefault();

});

/* editor field list: double-click a row to type the question right there */
document.addEventListener('dblclick', e => {
  if (view !== 'editor') return;
  const item = e.target.closest('.f-item'); if (!item || item.querySelector('.f-edit')) return;
  const q = E.qs.find(x => x.id === item.dataset.field); if (!q) return;
  const inp = document.createElement('input');

document.addEventListener('focusout', e => { if (e.target.dataset?.fedit) commitFEdit(e.target); });
function commitFEdit(el){
  if (!el.isConnected || !E) return;
  const q = E.qs.find(x => x.id === el.dataset.fedit);
  if (q && el.value !== q.title){
    q.title = el.value;

/* editor cards: drag the top-centre handle up or down */
let cDrag = null;
document.addEventListener('dragstart', e => {
  const g = e.target.closest?.('[data-grip]'); if (!g || view !== 'editor') return;
  cDrag = g.dataset.grip;
  const card = g.closest('.qwrap'), r = card.getBoundingClientRect();
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', cDrag);
  e.dataTransfer.setDragImage?.(card, e.clientX - r.left, e.clientY - r.top);
  requestAnimationFrame(() => card.classList.add('dragging'));
});
// Dropping anywhere on another card (or the gap nearest it) takes that card's place:
// moving up lands above it, moving down lands below it, like Google Forms.
function cardDropTarget(e){
  const sc = $('#cscroll'); if (!sc || !sc.contains(e.target)) return null;
  let w = e.target.closest('.qwrap');
  if (!w) w = [...sc.querySelectorAll('.qwrap')].map(c => {
    const r = c.getBoundingClientRect();
    return {c, d: e.clientY < r.top ? r.top - e.clientY : e.clientY > r.bottom ? e.clientY - r.bottom : 0};
  }).sort((a, b) => a.d - b.d)[0]?.c;
  if (!w || w.dataset.q === cDrag) return null;
  const from = E.qs.findIndex(q => q.id === cDrag), to = E.qs.findIndex(q => q.id === w.dataset.q);
  return {w, after: to > from};
}
document.addEventListener('dragover', e => {
  if (!cDrag) return;
  const sc = $('#cscroll');
  if (sc){   // scroll while holding a card near the top or bottom edge
    const r = sc.getBoundingClientRect();
    if (e.clientY < r.top + 70) sc.scrollBy({top: -16, behavior: 'instant'});
    else if (e.clientY > r.bottom - 70) sc.scrollBy({top: 16, behavior: 'instant'});
  }
  const t = cardDropTarget(e);
  document.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  if (!t) return;
  e.preventDefault();
  t.w.classList.add(t.after ? 'drop-after' : 'drop-before');
});
document.addEventListener('drop', e => {
  if (!cDrag) return;
  const t = cardDropTarget(e);
  const id = cDrag; cDrag = null; clearDrop();
  if (!t) return;
  e.preventDefault();
  moveEQ(id, t.w.dataset.q, t.after, '카드');
});
document.addEventListener('dragend', () => { if (cDrag){ cDrag = null; clearDrop(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches?.('.f-item[role="button"]')) e.target.click();
});

let dragId = null;
const clearDrop = () => document.querySelectorAll('.dragging,.drop-before,.drop-after').forEach(x => x.classList.remove('dragging', 'drop-before', 'drop-after'));

});
document.addEventListener('drop', e => {

function setColor(key, val, how){
  if (!/^#[0-9a-f]{6}$/i.test(val) || B[key] === val.toLowerCase()) return renderBPanel();
  B[key] = val.toLowerCase(); B.theme = null;
  log('color_changed', `${COLORN[key]} = ${B[key]} (${how})`);
  renderBrand();
}

function brandChange(el){
  if (el.dataset.bc) return setColor(el.dataset.bc, el.value, '직접 고르기');
  if (el.dataset.bhex){ const v = el.value.trim(); return setColor(el.dataset.bhex, v.startsWith('#') ? v : '#' + v, '직접 입력'); }
  if (el.dataset.bf){ B[el.dataset.bf] = el.value; log('font_changed', `${el.dataset.bf === 'titleFont' ? '제목' : '본문'} 글꼴 = ${FONTS[el.value].label}`); return renderBrand(); }
  if (el.dataset.bl){ log('button_label_changed', `${el.dataset.bl === 'next' ? '다음' : '응답 제출'} 버튼 = "${el.value}"`); return; }
  if ('blogo' in el.dataset){ B.logo = el.checked; log('logo_toggled', B.logo ? '켬' : '끔'); return renderBrand(); }
}

function brandClick(a){
  const v = a.dataset.v;
  switch (a.dataset.act){
    case 'bTheme': Object.assign(B, pickColors(v)); B.theme = v; log('theme_selected', THEMES[v].label); break;
    case 'bColor': if (B[a.dataset.k] === v) return true; B[a.dataset.k] = v; B.theme = null; log('color_changed', `${COLORN[a.dataset.k]} = ${v} (기본 색)`); break;
    case 'bSize': if (B.size === v) return true; B.size = v; log('font_size_changed', SIZES[v][0]); break;
    case 'bShape': if (B.shape === v) return true; B.shape = v; log('button_shape_changed', SHAPES[v][0]); break;
    case 'bLogoPos': if (B.logoPos === v) return true; B.logoPos = v; log('logo_toggled', `위치 = ${v === 'left' ? '왼쪽 위' : '가운데'}`); break;
    case 'bUnify': log('font_changed', `문항별 글꼴 ${Object.keys(B.overrides).length}개 → 전체 글꼴로 맞춤`); B.overrides = {}; break;
    case 'bReset': newBrand(B.overrides); log('branding_reset'); break;
    default: return false;

  renderBrand();

}

function pvQ(q, tSize, b){
  const a = PV.ans[q.id], err = PV.err[q.id], i = E.qs.indexOf(q), f = b.overrides?.[i], t = T[q.type];
  const opts = answersOf(q);
  let ctl;
  if (q.type === 'choice'){
    const multi = q.selMode !== 'one', on = v => multi ? (a || []).includes(v) : a === v;
    const hint = multi ? `<div class="pvr-hint">${{exact: `${q.selCount}개를 골라주세요`, min: `${q.selCount}개 이상 골라주세요`, max: `최대 ${q.selCount}개까지 고를 수 있어요`}[q.selMode]}</div>` : '';
    ctl = hint + (q.variant === 'photo'
      ? `<div class="pvr-photos">${q.options.map((o, j) => { const v = o.trim() || `사진 ${j + 1}`;
          return `<button class="pvr-ph ${on(v) ? 'on' : ''}" data-pv="pick" data-q="${q.id}" data-v="${esc(v)}">${q.photos?.[j] ? `<img src="${q.photos[j]}" alt="">` : '<span class="pvr-noimg">사진</span>'}<span class="cap">${esc(v)}</span></button>`; }).join('')}</div>`
      : opts.map(o => `<button class="pvr-opt ${on(o) ? 'on' : ''}" data-pv="pick" data-q="${q.id}" data-v="${esc(o)}"><i class="${multi ? 'sq' : ''}"></i>${esc(o)}</button>`).join(''));
  } else if (q.type === 'dropdown'){
    ctl = `<select class="pvr-in" data-pv-in="${q.id}"><option value="">선택하세요</option>${opts.map(o => `<option ${a === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  } else if (q.type === 'rank'){
    ctl = `<div class="pvr-hint">누르는 순서대로 순위가 매겨져요. 다시 누르면 빠져요.</div>` + opts.map(o => { const r = (a || []).indexOf(o);
      return `<button class="pvr-opt rank ${r >= 0 ? 'on' : ''}" data-pv="rank" data-q="${q.id}" data-v="${esc(o)}"><b>${r >= 0 ? r + 1 : ''}</b>${esc(o)}</button>`; }).join('');
  } else if (q.type === 'scale'){
    ctl = `<div class="pvr-scale"><small>전혀 아니다</small>${['1', '2', '3', '4', '5'].map(v => `<button class="${a === v ? 'on' : ''}" data-pv="pick" data-q="${q.id}" data-v="${v}">${v}</button>`).join('')}<small>매우 그렇다</small></div>`;
  } else if (q.type === 'table'){
    const rows = ['강의 내용', '진행 방식'], cols = ['그렇다', '보통', '아니다'];
    ctl = `<div class="pvr-table"><span></span>${cols.map(c => `<span>${c}</span>`).join('')}${rows.map(r => `<span class="rh">${r}</span>${cols.map(c =>
      `<button class="${(a || {})[r] === c ? 'on' : ''}" data-pv="cell" data-q="${q.id}" data-row="${r}" data-v="${c}" aria-label="${r} ${c}"></button>`).join('')}`).join('')}</div>`;
  } else if (t.kind === 'input'){
    const ph = esc(q.placeholder || VAR_TEXT[q.type]?.[q.variant] || t.ph || '');
    ctl = q.type === 'text' && q.variant === 'long'
      ? `<textarea class="pvr-in" data-pv-in="${q.id}" placeholder="${ph}">${esc(a || '')}</textarea>`
      : `<input class="pvr-in" data-pv-in="${q.id}" value="${esc(a || '')}" placeholder="${ph}" ${q.type === 'number' ? 'inputmode="numeric"' : ''}>`;
  } else if (q.type === 'date' || q.type === 'time'){
    ctl = `<input class="pvr-in" type="${q.type}" data-pv-in="${q.id}" value="${esc(a || '')}">`;
  } else if (q.type === 'capture' || q.type === 'upload'){
    const acc = q.variant === 'video' ? 'video/*' : q.variant === 'file' ? '' : 'image/*';
    ctl = `<label class="pvr-file">${a ? `✓ ${esc(a)}` : esc(VAR_TEXT[q.type]?.[q.variant] || t.fake)}<input type="file" hidden data-pv-file="${q.id}" ${acc ? `accept="${acc}"` : ''}></label>`;
  } else if (q.type === 'privacy'){
    ctl = `<label class="pvr-agree"><input type="checkbox" data-pv-chk="${q.id}" ${a ? 'checked' : ''}>개인정보 수집·이용에 동의합니다</label>`;
  } else {   // pay
    ctl = `<button class="pvr-opt" data-pv="pay" data-q="${q.id}">${a ? '✓ 결제 완료 (미리보기)' : '간편결제로 결제하기'}</button>`;
  }

function pvCheck(q){
  const a = PV.ans[q.id];
  const empty = a === undefined || a === '' || (Array.isArray(a) && !a.length) || (q.type === 'table' && Object.keys(a || {}).length < 2);
  if (empty) return q.required ? '필수 문항이에요' : null;
  if (q.type === 'choice' && q.selMode !== 'one'){
    const n = a.length, k = q.selCount;
    if (q.selMode === 'exact' && n !== k) return `${k}개를 골라주세요 (지금 ${n}개)`;
    if (q.selMode === 'min' && n < k) return `${k}개 이상 골라주세요 (지금 ${n}개)`;
  }
  if (q.formatCheck && q.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a)) return '이메일 형식으로 입력해주세요 (예: name@email.com)';
  if (q.formatCheck && q.type === 'phone' && !/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(String(a).replace(/\s/g, ''))) return '전화번호 형식으로 입력해주세요 (예: 010-1234-5678)';
  return null;
}

function pvNext(){
  const end = pageEnd(PV.start), qs = E.qs.slice(PV.start, end + 1);
  PV.err = {};
  qs.forEach(q => { const m = pvCheck(q); if (m) PV.err[q.id] = m; });
  const bad = Object.keys(PV.err);
  if (bad.length){
    log('preview_validation_error', bad.map(id => `Q${E.qs.indexOf(qById(id)) + 1} ${PV.err[id]}`).join(' / '));
    renderPreviewLayer();
    document.getElementById('pvq-' + bad[0])?.scrollIntoView({block: 'center', behavior: 'smooth'});
    return;
  }
  // the first question on this page whose logic leads somewhere other than straight on decides the jump
  let target = null;
  for (const q of qs){
    const to = go(q, PV.ans[q.id], PV.ans), straight = E.qs[E.qs.indexOf(q) + 1]?.id || 'end_done';
    if (to !== straight){ target = to; break; }
  }
  const nextPage = E.qs[end + 1]?.id || 'end_done';
  if (!target || (!END[target] && E.qs.findIndex(x => x.id === target) <= end)) target = nextPage;   // broken links just carry on
  log('preview_next', `Q${PV.start + 1}~Q${end + 1} → ${END[target] ? END[target].label : `Q${E.qs.findIndex(x => x.id === target) + 1}`}${target !== nextPage ? ' (로직으로 이동)' : ''}`);
  if (END[target]){ PV.end = target; log('preview_completed', END[target].label); }
  else { PV.hist.push(PV.start); PV.start = E.qs.findIndex(x => x.id === target); }
  renderPreviewLayer(true);
}

(function bindPreview(){
  const pvl = $('#pvLayer');
  // keep editor shortcuts and handlers (undo, drag, card clicks) out of the preview
  ['click', 'input', 'change', 'keydown', 'dblclick', 'paste', 'drop', 'focusin', 'focusout'].forEach(t => pvl.addEventListener(t, e => e.stopPropagation()));
  pvl.addEventListener('click', e => {
    const el = e.target.closest('[data-pv]'); if (!el || !PV) return;
    const q = el.dataset.q && qById(el.dataset.q), v = el.dataset.v;
    switch (el.dataset.pv){
      case 'close': closePreview(); return;
      case 'restart': Object.assign(PV, {start: 0, ans: {}, hist: [], err: {}, end: null}); log('preview_restarted'); renderPreviewLayer(true); return;
      case 'dev': PV.device = v; renderPreviewLayer(); return;
      case 'prev': PV.start = PV.hist.pop(); PV.err = {}; renderPreviewLayer(true); return;
      case 'next': pvNext(); return;
      case 'pick':
        if (q.type === 'choice' && q.selMode !== 'one'){
          const arr = PV.ans[q.id] ||= [], ix = arr.indexOf(v);
          if (ix >= 0) arr.splice(ix, 1);
          else if ((q.selMode === 'max' || q.selMode === 'exact') && arr.length >= q.selCount){ PV.err[q.id] = `최대 ${q.selCount}개까지 고를 수 있어요`; renderPreviewLayer(); return; }
          else arr.push(v);
        } else PV.ans[q.id] = v;
        break;
      case 'rank': { const arr = PV.ans[q.id] ||= [], ix = arr.indexOf(v); ix >= 0 ? arr.splice(ix, 1) : arr.push(v); break; }
      case 'cell': (PV.ans[q.id] ||= {})[el.dataset.row] = v; break;
      case 'pay': PV.ans[q.id] = '결제 완료'; break;
    }
    delete PV.err[q.id];
    renderPreviewLayer();
  });
  pvl.addEventListener('input', e => {
    const id = e.target.dataset.pvIn; if (!id || !PV) return;
    PV.ans[id] = e.target.value;
    if (PV.err[id]){ delete PV.err[id]; const box = e.target.closest('.pvr-q'); box.classList.remove('has-err'); box.querySelector('.pvr-err')?.remove(); }
  });
  pvl.addEventListener('change', e => {
    const el = e.target; if (!PV) return;
    if (el.dataset.pvIn){ PV.ans[el.dataset.pvIn] = el.value; return; }
    const id = el.dataset.pvChk || el.dataset.pvFile; if (!id) return;
    if (el.dataset.pvChk) PV.ans[id] = el.checked ? '동의' : undefined;
    else if (el.files?.[0]) PV.ans[id] = el.files[0].name;
    delete PV.err[id]; renderPreviewLayer();
  });
  pvl.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });
})();

/* ---------- undo / redo (per screen) ----------
   Every user event is wrapped: take a snapshot before it, compare after, and keep the old one if anything changed.
   Selection, zoom and test runs are left out of the snapshot so only real edits are undone. */
let HIST = {editor: {u: [], r: []}, logic: {u: [], r: []}, brand: {u: [], r: []}};
const SCREEN = {editor: '문항 편집', logic: '구조와 로직', brand: '브랜딩'};
const clearHist = v => { HIST[v].u = []; HIST[v].r = []; };
function snap(v = view){
  if (v === 'editor' && E) return JSON.stringify(E.qs);
  if (v === 'logic' && L) return JSON.stringify({qs: L.qs, groups: L.groups, gseq: L.gseq, rseq: L.rseq, pos: L.pos, arranged: L.arranged});
  if (v === 'brand' && B) return JSON.stringify(B);
  return null;
}
function pushHist(v, s){
  if (s == null || s === snap(v)) return;
  const h = HIST[v]; h.u.push(s); h.r = [];
  if (h.u.length > 100) h.u.shift();
}
function restore(v, s){
  const d = JSON.parse(s);
  if (v === 'editor'){
    E.qs = d; E.menuFor = E.bulkFor = null;
    if (!E.qs.some(q => q.id === E.cur)) E.cur = E.qs[0]?.id ?? null;
    E.pk = E.qs.length ? {...E.pk, open: false} : {open: true, mode: 'first', tab: 'frequent', q: '', sel: null};
    renderFields(); renderCards(); renderPanel();
  } else if (v === 'logic'){
    Object.assign(L, d);
    L.test = null; L.frame = null; L.checked = new Set();
    if (L.sel && !lq(L.sel)) L.sel = null;
    L.broken = new Set(L.qs.filter(isBroken).map(q => q.id));
    renderLogic();
  } else if (v === 'brand'){ B = d; if (CUR) CUR.B = B; renderBrand(); }
}
function undoRedo(redo){
  const h = HIST[view];
  if (!h){ toast('이 화면에는 되돌릴 작업이 없어요'); return; }
  const from = redo ? h.r : h.u, to = redo ? h.u : h.r;
  if (!from.length){ toast(redo ? '다시 실행할 작업이 없어요' : '되돌릴 작업이 없어요'); return; }
  to.push(snap());
  restore(view, from.pop());
  log(redo ? 'redo' : 'undo', `${SCREEN[view]} · 남은 되돌리기 ${h.u.length}개`);
  toast(redo ? '다시 실행했어요' : '되돌렸어요 · 다시 실행은 Ctrl+Shift+Z');
}

const isText = el => !!el?.matches?.('textarea, input:not([type]), input[type=text], input[type=number]');
let pre = null, textSnap = null;
// text fields update state on every keystroke, so their "before" is taken when the field gets focus
document.addEventListener('focusin', e => { if (isText(e.target) && HIST[view]) textSnap = {view, s: snap()}; }, true);
function hold(e){
  if (pre || !HIST[view]) return;
  if (e.type === 'keydown' && e.key !== 'Enter') return;
  if (e.type === 'click' && e.target.closest?.('[data-act="undo"],[data-act="redo"]')) return;   // these move through history themselves
  pre = e.type === 'change' && isText(e.target) && textSnap?.view === view ? textSnap : {view, s: snap()};
  setTimeout(() => {
    const p = pre; pre = null;
    if (p && p.view === view) pushHist(view, p.s);
    if (isText(document.activeElement)) textSnap = {view, s: snap()};
  }, 0);
}
['click', 'change', 'paste', 'drop', 'keydown'].forEach(t => document.addEventListener(t, hold, true));
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 's' && CUR){ e.preventDefault(); manualSave('Ctrl+S'); return; }
  if (!(e.ctrlKey || e.metaKey) || (k !== 'z' && k !== 'y')) return;
  if (isText(e.target)) return;   // inside a text field, the browser's own text undo applies
  e.preventDefault();
  undoRedo(k === 'y' || e.shiftKey);
});

function renderLog(){
  $('#logLayer').innerHTML = `<div class="log">
    <div class="log-h"><b>기록 (${LOG.length})</b><button class="btn" data-act="copyLog">복사하기</button><button class="btn" data-act="toggleLog">닫기</button></div>
    <div class="log-body"><table><thead><tr><th>#</th><th>시각</th><th>경과(초)</th><th>이벤트</th><th>상세</th></tr></thead><tbody>
    ${LOG.map((l, i) => `<tr><td class="num">${i + 1}</td><td class="num">${fmt(l.t)}</td><td class="num">${l.el.toFixed(1)}</td><td class="ev">${l.ev}</td><td>${esc(l.detail)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  const b = $('#logLayer .log-body'); b.scrollTop = b.scrollHeight;
}
function copyText(txt, done, failMsg){
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    ok ? done() : toast(failMsg);
  };
  try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
}
function copyLog(){
  const clean = s => String(s).replace(/[\t\r\n]+/g, ' ');
  const txt = [['#','시각','경과(초)','이벤트','상세'], ...LOG.map((l, i) => [i + 1, fmt(l.t), l.el.toFixed(1), l.ev, clean(l.detail)])]
    .map(r => r.join('\t')).join('\n');
  copyText(txt, () => toast(`기록 ${LOG.length}건을 표 형식으로 복사했어요`), '복사하지 못했어요. 표를 드래그해서 복사해주세요');
}

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800); }

      const k = E.pk.sel = pick.dataset.pick;
      const where = E.pk.q.trim() ? `검색 "${E.pk.q.trim()}"` : TABN[E.pk.tab];
      log('type_selected', `${T[k].label} · ${where} · ${E.pk.mode === 'first' ? '첫 문항' : '문항 추가'}`);
      pickNext();   // one click creates the question; there is no separate '다음' step
      return;
    }
    const mt = e.target.closest('[data-menu-type]');
    if (mt){
      const q = E.qs.find(x => x.id === E.menuFor);
      E.menuFor = null;
      if (q.type !== mt.dataset.menuType) setType(q, mt.dataset.menuType);
      else renderCards();
      return;
    }
    if (e.target.closest('.f-edit')) return;
    const fi = e.target.closest('[data-field]');
    if (fi){ setActive(fi.dataset.field); focusCard(fi.dataset.field); return; }
    const card = e.target.closest('[data-q]');
    if (card) setActive(card.dataset.q);
    if (E.menuFor && !e.target.closest('.tmenu,[data-act="typeMenu"],[data-act="typeMenuPanel"]')){ E.menuFor = null; renderCards(); }
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const q = E ? qOf(a) : null;
  switch (a.dataset.act){
    case 'create': newProject(); log('create_clicked', CUR.name); formatScreen(); break;
    case 'publish':
      if (CUR.status === 'published') doPublish(); else openPublish();
      break;
    case 'pubClose': if (a.classList.contains('confirm-bg') && e.target !== a) break; $('#confirmLayer').innerHTML = ''; break;
    case 'pubGo': doPublish(); break;
    case 'pubPreview': $('#confirmLayer').innerHTML = ''; openPreview('게시 전 점검'); break;
    case 'pubLog': $('#confirmLayer').innerHTML = ''; logOpen = true; renderLog(); break;
    case 'pubFix': {
      $('#confirmLayer').innerHTML = ''; log('publish_fix', `${qn(E.qs.find(x => x.id === a.dataset.q))} 제목 고치기`);
      if (view !== 'editor') editor();
      setActive(a.dataset.q); focusCard(a.dataset.q); $(`#card-${a.dataset.q} .qtitle`)?.focus();
      break;
    }
    case 'copyLink':
      if (CUR?.status !== 'published'){ toast('게시하면 공유 링크가 생겨요'); break; }
      copyText(pubLink(), () => { log('link_copied', pubLink()); toast('링크를 복사했어요'); }, '복사하지 못했어요. 링크를 직접 선택해 복사해주세요');
      break;
    case 'undo': undoRedo(false); break;
    case 'redo': undoRedo(true); break;
    case 'manualSave': manualSave('상단 저장 버튼'); break;
    case 'settings': toggleSettings(); break;
    case 'setLog': toggleSettings(false); logOpen = true; renderLog(); log('test_log_opened', '설정 메뉴'); break;
    case 'setDelAll':
      toggleSettings(false);
      askConfirm(`데모 설문 ${PROJECTS.length}개를 모두 지울까요?<br>지우면 되돌릴 수 없고 홈으로 돌아가요.`, '모두 지우기', () => {
        log('project_deleted', `설정 메뉴 · 전체 ${PROJECTS.length}개`);
        PROJECTS = []; CUR = null; E = L = B = null; saveNow(); home();
      });
      break;
    case 'confirmYes': { $('#confirmLayer').innerHTML = ''; const f = pending; pending = null; f && f(); break; }
    case 'toLogic': logicScreen(a.dataset.src); break;
    case 'toBranding': brandScreen(a.dataset.src); break;
    case 'toEdit': if (!E) newEditor(); editor(); break;
    case 'backLogic': logicScreen('준비 중 화면에서 돌아옴'); break;
    case 'backBrand': brandScreen('준비 중 화면에서 돌아옴'); break;
    case 'toPublish': openPreview(a.closest('#bPrev') ? '브랜딩 샘플 버튼' : '브랜딩 다음 단계 버튼'); break;
    case 'bpvOpt': a.closest('.pv-q').querySelectorAll('.pv-opt').forEach(o => o.classList.toggle('on', o === a)); break;
    case 'preview': openPreview(a.dataset.src); break;
    case 'home': log('back_home', a.dataset.src); picked = null; home(); break;
    case 'soon': toast(`${a.dataset.what}은(는) 준비 중이에요`); break;
    // back to the first screen; projects stay saved and are deleted only from the home cards
    case 'reset':
      log('reset', `프로젝트 ${PROJECTS.length}개 유지`);
      t0 = new Date(); picked = null; CUR = null; E = L = B = null; home(); break;
    case 'resetNo': $('#confirmLayer').innerHTML = ''; break;
    case 'delProj': {
      const p = PROJECTS.find(x => x.id === a.dataset.id);
      askConfirm(`'${esc(p.name)}' 프로젝트를 삭제할까요?<br>삭제하면 되돌릴 수 없어요.`, '삭제', () => {
        PROJECTS = PROJECTS.filter(x => x !== p);
        log('project_deleted', `${p.name} · ${p.status === 'published' ? '게시됨' : '미게시'}`);
        saveNow(); home();
      });
      break;
    }
    case 'delAll':
      askConfirm(`프로젝트 ${PROJECTS.length}개를 모두 삭제할까요?<br>삭제하면 되돌릴 수 없어요.`, '모두 삭제', () => {
        log('project_deleted', `전체 ${PROJECTS.length}개`);
        PROJECTS = []; saveNow(); home();
      });
      break;
    case 'toggleLog': logOpen = !logOpen; logOpen ? renderLog() : ($('#logLayer').innerHTML = ''); break;
    case 'copyLog': copyLog(); break;
    /* editor */
    case 'pkTab':
      if (E.pk.tab !== a.dataset.v || E.pk.q.trim()){
        if (E.pk.tab !== a.dataset.v) log('type_tab_changed', a.dataset.v);
        E.pk.tab = a.dataset.v; E.pk.q = ''; renderPanel();
      }
      break;
    case 'variant': {
      const from = q.variant; if (from === a.dataset.v) break;
      q.variant = a.dataset.v;
      log('type_changed', `${qn(q)} · ${T[q.type].label} ${VAR[q.type].label}: ${varLabel(q.type, from)} → ${varLabel(q.type, q.variant)}`);
      renderCards(); renderPanel(); break;
    }
    case 'pkNext': pickNext(); break;
    case 'closePk': closePk(a.classList.contains('pkm-bg') ? '바깥 클릭' : '닫기 버튼'); break;
    case 'customItem': toast('커스텀 문항은 준비 중이에요'); break;
    case 'addQ': if (q) setActive(q.id); openPicker(E.qs.length ? 'add' : 'first', a.dataset.src); break;
    case 'typeMenu': E.menuFor = E.menuFor === q.id ? null : q.id; renderCards(); break;
    case 'typeMenuPanel': E.menuFor = E.cur; renderCards(); focusCard(E.cur); break;
    case 'addEnding': {
      const kind = endings().some(x => x.kind === 'end_stop') ? 'end_done' : 'end_stop';
      endings().push({id: 'en' + (++enSeq), kind, title: '', msg: ''});
      log('ending_added', `엔딩 ${endings().length} · ${END_KIND[kind]}`);
      renderFields(); renderCards();
      const c = $(`#end-${endings().length - 1}`); c?.scrollIntoView({block: 'center', behavior: 'smooth'}); c?.querySelector('.end-title').focus({preventScroll: true});
      break;
    }
    case 'goEnding': { const c = $(`#end-${a.dataset.k}`); c?.scrollIntoView({block: 'center', behavior: 'smooth'}); c?.querySelector('.end-title').focus({preventScroll: true}); break; }
    case 'endKind': {
      const en = endings()[+a.dataset.k]; if (en.kind === a.dataset.v) break;
      en.kind = a.dataset.v;
      log('ending_kind_changed', `엔딩 ${+a.dataset.k + 1} → ${END_KIND[en.kind]}`);
      renderFields(); renderCards(); break;
    }
    case 'delEnding': {
      if (endings().length < 2){ toast('엔딩은 하나 이상 있어야 해요'); break; }
      const k = +a.dataset.k, en = endings()[k];
      endings().splice(k, 1);
      log('ending_deleted', `엔딩 ${k + 1} · ${END_KIND[en.kind]}`);
      renderFields(); renderCards(); break;
    }
    case 'rpClose': E.cur = null; renderCards(); renderFields(); renderPanel(); break;
    case 'entOnly': log('enterprise_clicked', a.dataset.what); toast(`${a.dataset.what}은(는) Enterprise 요금제에서 쓸 수 있어요`); break;
    case 'addOpt':
      q.options.push('');
      log('option_added', `${qn(q)} · 선택지 ${q.options.length}`);
      renderCards();
      document.querySelector(`#card-${q.id} [data-f="opt"][data-i="${q.options.length - 1}"]`)?.focus();
      break;
    case 'delOpt': {
      const i = +a.dataset.i, txt = q.options[i];
      q.options.splice(i, 1); q.photos?.splice(i, 1); if (!q.options.length) q.options = [''];
      log('option_deleted', `${qn(q)} · 선택지 ${i + 1}${txt ? ` "${txt}"` : ' (빈 칸)'}`);
      renderCards(); break;
    }
    case 'bulkToggle':
      E.bulkFor = E.bulkFor === q.id ? null : q.id; renderCards();
      if (E.bulkFor) $('#bulkText')?.focus();
      break;
    case 'bulkAdd': {
      const lines = ($('#bulkText').value || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (!lines.length){ toast('추가할 선택지를 한 줄에 하나씩 입력해주세요'); break; }
      E.bulkFor = null;
      // fill trailing empty rows before appending
      while (q.options.length && !q.options[q.options.length - 1].trim()) q.options.pop();
      addOptions(q, lines, q.options.length, '일괄 추가 입력창');
      break;
    }
    case 'sel': setCond(q, 'selMode', a.dataset.v); break;
    case 'inc': setCond(q, 'selCount', q.selCount + 1); break;
    case 'dec': setCond(q, 'selCount', q.selCount - 1); break;
    case 'dup': {
      const c = {...JSON.parse(JSON.stringify(q)), id: 'q' + (++seq)};
      E.qs.splice(E.qs.indexOf(q) + 1, 0, c);
      E.cur = c.id;
      log('question_duplicated', `${qn(q)} → ${qn(c)}`);
      renderFields(); renderCards(); renderPanel(); focusCard(c.id);
      break;
    }
    case 'delQ': {
      const i = E.qs.indexOf(q);
      log('question_deleted', `${qn(q)} · ${T[q.type].label}${q.title ? ` "${q.title}"` : ''}`);
      E.qs.splice(i, 1);
      E.cur = (E.qs[i] || E.qs[i - 1] || {}).id ?? null;
      if (!E.qs.length){ E.pk = {open: true, mode: 'first', tab: 'frequent', q: '', sel: null}; log('type_opened', '첫 문항 (모두 삭제 후)'); }
      renderFields(); renderCards(); renderPanel();
      break;
    }
    case 'nextStage': logicScreen('다음 단계 버튼'); break;
    case 'backEditor': editor(); break;
  }
});

/* ---------- saving projects in this browser ----------
   Projects are written to localStorage after each recorded action, so they survive '처음부터 다시' and a page reload.
   Undo history and on-screen selection are not saved. */
const STORE = 'walla-demo-projects-v1';
let saveTimer = null, savedAt = null;
const saveLabel = () => savedAt ? `자동 저장 ${String(savedAt.getHours()).padStart(2, '0')}:${String(savedAt.getMinutes()).padStart(2, '0')}` : '';
function manualSave(src){ saveNow(); log('saved', src); toast('임시 저장했어요'); }
const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); };
function saveNow(){
  clearTimeout(saveTimer);
  const data = PROJECTS.map(p => ({id: p.id, name: p.name, status: p.status, view: p.view, link: p.link,
    created: +p.created, updated: +p.updated, publishedAt: p.publishedAt ? +p.publishedAt : null,
    E: p.E ? {qs: p.E.qs, cur: p.E.cur, endings: p.E.endings, ending: p.E.ending, desc: p.E.desc, stitle: p.E.stitle} : null,
    L: p.L ? {groups: p.L.groups, gseq: p.L.gseq, rseq: p.L.rseq, arranged: p.L.arranged, pos: p.L.pos, zoom: p.L.zoom, done: p.L.done, t0: p.L.t0} : null,
    B: p.B}));
  try {
    localStorage.setItem(STORE, JSON.stringify(data));
    savedAt = new Date();
    const s = $('#autoSave'); if (s) s.textContent = saveLabel();
  }
  catch (e) { toast('브라우저 저장 공간이 부족해서 저장하지 못했어요. 사진이 많은 프로젝트를 지워주세요'); }
}
function loadSaved(){
  let data = [];
  try { data = JSON.parse(localStorage.getItem(STORE) || '[]'); } catch (e) {}
  PROJECTS = data.map(d => ({...d, created: new Date(d.created), updated: new Date(d.updated), publishedAt: d.publishedAt ? new Date(d.publishedAt) : null,
    E: d.E && {qs: d.E.qs, cur: d.E.cur, endings: d.E.endings, ending: d.E.ending, desc: d.E.desc, stitle: d.E.stitle, pk: {open: !d.E.qs.length, mode: 'first', tab: 'frequent', q: '', sel: null}, menuFor: null, bulkFor: null},
    // older saves kept their own logic questions; those are dropped and the editor's questions are used
    L: d.L && makeL((({qs, ...rest}) => ({...rest, sel: null, checked: new Set(), broken: new Set(), frame: null, lastP: {}, ox: 0, oy: 0, W: 0, H: 0, test: null}))(d.L)),
    B: d.B && {...d.B, overrides: d.B.overrides?.p2 || d.B.overrides?.p6 ? {0: d.B.overrides.p2, 1: d.B.overrides.p6} : d.B.overrides || {}},
    hist: {editor: {u: [], r: []}, logic: {u: [], r: []}, brand: {u: [], r: []}}}));
  // new ids must not collide with saved ones
  PROJECTS.forEach(p => p.E?.qs.forEach(q => { seq = Math.max(seq, parseInt(q.id.slice(1), 10) || 0); }));
  pjSeq = PROJECTS.reduce((m, p) => Math.max(m, parseInt(p.id.slice(2), 10) || 0), 0);
}

loadSaved();
// the clock and the first screen start once the participant code is in
askParticipant(home);
</script>
